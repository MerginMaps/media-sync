name: Tests for Mergin Maps Media Sync

on:
  push:
    paths:
    - "test/**"
    - "**.py"
    - ".github/workflows/tests_mergin_media_sync.yaml"
    - "Pipfile"
    - "Pipfile.lock"
  workflow_dispatch:

env:
  TEST_MERGIN_URL: https://app.dev.merginmaps.com
  TEST_API_USERNAME: test_media_sync
  TEST_API_PASSWORD: ${{ secrets.TEST_API_PASSWORD }}
  TEST_API_WORKSPACE: test-media-sync
  # AWS S3 bucket managed in lara-infra (env/dev-ew1/services/media-sync-ci), tests are skipped if not set
  TEST_AWS_S3_BUCKET: ${{ vars.TEST_AWS_S3_BUCKET }}
  TEST_AWS_S3_REGION: ${{ vars.TEST_AWS_S3_REGION }}
  TEST_AWS_ACCESS_KEY_ID: ${{ secrets.TEST_AWS_ACCESS_KEY_ID }}
  TEST_AWS_SECRET_ACCESS_KEY: ${{ secrets.TEST_AWS_SECRET_ACCESS_KEY }}
  TEST_GOOGLE_DRIVE_FOLDER: SAVE_FOLDER
  TEST_GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE: google-credentials.json

jobs:

  Tests-for-Mergin-Maps-Media-Sync:

    runs-on: ubuntu-22.04

    steps:

      - name: Install Spatialite
        run: sudo apt-get install -y libsqlite3-mod-spatialite

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Save Google Credentials File
        run: echo "${{ secrets.GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE }}" | base64 -d > $TEST_GOOGLE_DRIVE_SERVICE_ACCOUNT_FILE

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pipenv
          pipenv install
          pipenv install --dev

      - name: Run S3-compatible server (Silo, MinIO fork) in Docker
        run: test/s3_servers/start.sh silo >> "$GITHUB_ENV"

      - name: Test Mergin Client
        shell: pipenv run python {0}
        run: |
          import os
          from mergin import MerginClient

          mc = MerginClient(os.environ.get('TEST_MERGIN_URL'), 
                            login=os.environ.get('TEST_API_USERNAME'), 
                            password=os.environ.get('TEST_API_PASSWORD'))

      - name: Run tests
        run: |
          pipenv run pytest test --cov=. --cov-report=term-missing:skip-covered -vv

  # S3 driver with other S3-compatible servers, no Mergin server or secrets are needed
  S3-compatible-servers:

    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        server: [rustfs, garage, seaweedfs]

    name: S3-compatible server (${{ matrix.server }})

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pipenv
          pipenv install
          pipenv install --dev

      - name: Run ${{ matrix.server }} in Docker
        run: test/s3_servers/start.sh ${{ matrix.server }} >> "$GITHUB_ENV"

      - name: Run tests
        run: pipenv run pytest test/test_s3_compatible.py -vv
